[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-forensics"
version = "0.1.0"
description = "Forensic, package-aware extraction of PowerPoint PPTX files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1",
    "lxml>=4.9",
]

[project.optional-dependencies]
pptx = ["python-pptx>=0.6.21"]
test = ["pytest>=7"]
ocr = ["Pillow>=9.0"]

[project.scripts]
pptx-forensics = "pptx_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
